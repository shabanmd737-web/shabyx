<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SHABYX</title>
<link rel="icon" href="/static/logo.png">
<style>
:root{--bg:#181818;--panel:#2b2b2b;--text:#ececec;--muted:#9a9a9a;--line:#3a3a3a;--accent:#4c7bd9}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;display:flex;flex-direction:column;font-size:16px}
header{display:flex;align-items:center;justify-content:space-between;padding:14px 20px}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:18px;letter-spacing:.3px}
.brand img{width:30px;height:30px;border-radius:8px;object-fit:cover}
.icon-btn{background:none;border:0;color:var(--muted);cursor:pointer;padding:8px;border-radius:8px;display:flex}
.icon-btn:hover{background:var(--panel);color:var(--text)}
main{flex:1;display:flex;flex-direction:column;min-height:0}
#messages{flex:1;overflow-y:auto;padding:10px 16px 20px}
.wrap{max-width:760px;margin:0 auto;width:100%}
.hero{text-align:center;font-size:32px;font-weight:500;margin-bottom:26px;padding:0 16px}
.empty main{justify-content:center;padding-bottom:9vh}
.empty #messages{display:none;flex:0}
.chat #hero,.chat #chips{display:none}
.msg{display:flex;margin:18px 0}
.msg.user{justify-content:flex-end}
.bubble{max-width:85%;line-height:1.65;word-wrap:break-word;overflow-wrap:anywhere}
.user .bubble{background:var(--panel);padding:10px 16px;border-radius:20px}
.bubble img.thumb{display:block;max-width:240px;border-radius:12px;margin-bottom:8px}
.bubble pre{background:#0f0f0f;border:1px solid var(--line);padding:12px;border-radius:10px;overflow-x:auto;margin:10px 0;font-size:14px}
.bubble code{font-family:Consolas,monospace;font-size:14px}
.bubble :not(pre)>code{background:#2b2b2b;padding:2px 6px;border-radius:5px}
.tools{margin-top:6px}
.dots span{display:inline-block;width:7px;height:7px;margin-right:4px;background:var(--muted);border-radius:50%;animation:b 1s infinite}
.dots span:nth-child(2){animation-delay:.15s}.dots span:nth-child(3){animation-delay:.3s}
@keyframes b{0%,60%,100%{opacity:.3}30%{opacity:1}}
.dock{padding:0 16px 14px}
.composer{background:var(--panel);border-radius:30px;padding:8px 10px;display:flex;align-items:flex-end;gap:6px;position:relative}
.composer textarea{flex:1;background:none;border:0;outline:0;color:var(--text);font:inherit;resize:none;max-height:160px;padding:9px 4px;line-height:1.4}
.composer textarea::placeholder{color:var(--muted)}
.round{width:36px;height:36px;border-radius:50%;border:0;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0}
.plus,.mic{background:none;color:var(--text)}
.plus:hover,.mic:hover{background:#3a3a3a}
.mic.on{background:#c0392b;color:#fff}
.send{background:var(--accent);color:#fff}
.send:disabled{background:#3a3a3a;color:#777;cursor:default}
.menu{position:absolute;bottom:56px;left:6px;background:#333;border:1px solid var(--line);border-radius:14px;padding:6px;display:none;min-width:180px;z-index:5}
.menu.show{display:block}
.menu button{display:block;width:100%;text-align:left;background:none;border:0;color:var(--text);font:inherit;padding:10px 12px;border-radius:9px;cursor:pointer}
.menu button:hover{background:#444}
.attach{display:none;gap:8px;margin:0 6px 8px;align-items:center;flex-wrap:wrap}
.attach.show{display:flex}
.tag{background:#262626;border:1px solid var(--line);border-radius:12px;padding:5px 10px;font-size:14px;display:flex;align-items:center;gap:8px;color:var(--muted)}
.tag img{width:34px;height:34px;object-fit:cover;border-radius:7px}
.tag b{cursor:pointer;color:var(--text)}
#chips{margin:14px 0 0 6px;display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.chip{background:none;border:0;color:var(--muted);font:inherit;font-size:15px;display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:12px;cursor:pointer}
.chip:hover{background:var(--panel);color:var(--text)}
.note{text-align:center;color:var(--muted);font-size:12px;padding-top:10px}
@media(max-width:600px){.hero{font-size:25px}}
</style>
</head>
<body class="empty">
<header>
  <div class="brand"><img src="/static/logo.png" alt="" onerror="this.style.display='none'">SHABYX</div>
  <button class="icon-btn" id="newChat" title="New chat" aria-label="New chat">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/></svg>
  </button>
</header>

<main>
  <div id="messages"><div class="wrap" id="list"></div></div>
  <div class="dock">
    <div class="wrap">
      <h1 class="hero" id="hero">What's on your mind today?</h1>
      <div class="attach" id="attach"></div>
      <div class="composer">
        <div class="menu" id="menu">
          <button id="pickImg">Upload image</button>
          <button id="pickCam">Take photo</button>
        </div>
        <button class="round plus" id="plus" aria-label="Add">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        </button>
        <textarea id="input" rows="1" placeholder="Ask SHABYX"></textarea>
        <button class="round mic" id="mic" aria-label="Voice input">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0014 0M12 18v3"/></svg>
        </button>
        <button class="round send" id="send" disabled aria-label="Send">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
        </button>
      </div>
      <div id="chips">
        <button class="chip" id="chipWrite"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/></svg>Write or edit</button>
        <button class="chip" id="chipWeb"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/></svg>Search the web</button>
      </div>
      <div class="note">SHABYX can make mistakes. Check important info.</div>
    </div>
  </div>
</main>

<input type="file" id="fileImg" accept="image/*" hidden>
<input type="file" id="fileCam" accept="image/*" capture="environment" hidden>

<script>
const $ = s => document.querySelector(s);
const input = $('#input'), sendBtn = $('#send'), list = $('#list'), box = $('#messages');
let history = [], image = null, web = false, busy = false;

/* ---------- helpers ---------- */
function esc(t){return t.replace(/&/g,'&amp;').replace(/</g,'&lt;')}
function md(t){
  t = esc(t);
  t = t.replace(/```(\w*)\n?([\s\S]*?)```/g,(m,l,c)=>'<pre><code>'+c+'</code></pre>');
  t = t.replace(/`([^`\n]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>');
  return t.replace(/\n/g,'<br>');
}
function refresh(){
  sendBtn.disabled = busy || !(input.value.trim() || image);
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight,160)+'px';
}
function renderAttach(){
  const a = $('#attach'); a.innerHTML = '';
  if(image){a.innerHTML += `<div class="tag"><img src="data:${image.mime};base64,${image.data}">Image<b id="rmImg">&times;</b></div>`;}
  if(web){a.innerHTML += `<div class="tag">Web search on<b id="rmWeb">&times;</b></div>`;}
  a.classList.toggle('show', !!(image||web));
  const ri=$('#rmImg'); if(ri) ri.onclick=()=>{image=null;renderAttach();refresh()};
  const rw=$('#rmWeb'); if(rw) rw.onclick=()=>{web=false;renderAttach()};
}
function addMsg(role, html){
  document.body.className = 'chat';
  const d = document.createElement('div');
  d.className = 'msg '+role;
  d.innerHTML = '<div class="bubble">'+html+'</div>';
  list.appendChild(d);
  box.scrollTop = box.scrollHeight;
  return d.querySelector('.bubble');
}

/* ---------- server call (retries while the free server wakes up) ---------- */
const sleep = ms => new Promise(r => setTimeout(r, ms));
async function ask(payload, b){
  let status = 0;
  for(let i=0;i<4;i++){
    try{
      const r = await fetch('/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({history:payload,web})});
      status = r.status;
      if([502,503,504].includes(r.status)) throw new Error('waking');
      return await r.json();
    }catch(e){
      if(i<3){ b.textContent = 'Waking up the server, please wait...'; await sleep(8000); }
    }
  }
  return {reply:'The server is not responding (status '+(status||'offline')+'). Please try again in a minute.'};
}

/* ---------- send ---------- */
async function send(audio){
  const text = audio ? '' : input.value.trim();
  if((!audio && !text && !image) || busy) return;
  busy = true;
  const img = audio ? null : image;
  const VOICE = 'The user sent a voice message. First write one line exactly like [[heard: the exact words the user said]] and then a blank line, then reply to the user following your language rules.';
  const entry = {role:'user', text: audio ? VOICE : (text || 'Describe this image.'), image: audio || img};
  history.push(entry);
  const ub = addMsg('user', audio ? '<i>Voice message...</i>' : (img?`<img class="thumb" src="data:${img.mime};base64,${img.data}">`:'') + md(text));
  if(!audio){ input.value=''; image=null; renderAttach(); }
  refresh();
  const b = addMsg('bot','<div class="dots"><span></span><span></span><span></span></div>');
  try{
    const payload = history.map((m,i)=>({role:m.role,text:m.text,image:i===history.length-1?m.image:null}));
    const j = await ask(payload, b);
    let reply = j.reply;
    if(audio){
      const m = reply.match(/^\s*\[\[heard:\s*([\s\S]*?)\]\]\s*/i);
      if(m){ entry.text = m[1].trim() || '(voice message)'; reply = reply.slice(m[0].length); }
      else { entry.text = '(voice message)'; }
      ub.innerHTML = md(entry.text); entry.image = null;
    }
    history.push({role:'model', text:reply});
    b.innerHTML = md(reply)+'<div class="tools"><button class="icon-btn" title="Listen" id="spk"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M11 5L6 9H2v6h4l5 4zM15.5 8.5a5 5 0 010 7M18.5 5.5a9 9 0 010 13"/></svg></button></div>';
    b.querySelector('#spk').onclick = ()=>speak(reply);
    if(audio) speak(reply);
  }catch(e){
    b.textContent = 'Something went wrong. Please try again.';
  }
  busy = false; refresh(); box.scrollTop = box.scrollHeight;
}
sendBtn.onclick = ()=>send();
input.addEventListener('input', refresh);
input.addEventListener('keydown', e=>{ if(e.key==='Enter' && !e.shiftKey){e.preventDefault();send();} });

/* ---------- speak / listen ---------- */
let voices = [];
function loadVoices(){ voices = speechSynthesis.getVoices(); }
loadVoices(); speechSynthesis.onvoiceschanged = loadVoices;
const FEMALE = ['Swara','Neerja','Heera','Kalpana','Aria','Jenny','Zira','Google \u0939\u093f\u0928\u094d\u0926\u0940','Google UK English Female','Samantha','Veena','Lekha','Female'];
const MALE = /Madhur|Hemant|Prabhat|Ravi|Rishi|David|Mark|Guy|Ryan|George|James|Daniel|Male/i;
function pickVoice(lang){
  const base = lang.slice(0,2);
  const pool = voices.filter(v => v.lang.toLowerCase().startsWith(base));
  const natural = pool.filter(v => /Natural|Online/i.test(v.name));
  for(const list of [natural, pool]){
    for(const p of FEMALE){
      const v = list.find(v => v.name.includes(p) && !(MALE.test(v.name) && !/Female/i.test(v.name)));
      if(v) return v;
    }
  }
  return pool.find(v => !MALE.test(v.name)) || pool[0] || null;
}
function speak(t){
  speechSynthesis.cancel();
  const hindi = /[\u0900-\u097F]/.test(t);
  const lang = hindi ? 'hi-IN' : 'en-IN';
  const u = new SpeechSynthesisUtterance(t.replace(/[*`#]/g,''));
  u.lang = lang;
  const v = pickVoice(lang);
  if(v) u.voice = v;
  u.rate = 0.98; u.pitch = 1.1;
  speechSynthesis.speak(u);
}
/* ---------- voice: Gemini hears the audio, so the language is detected automatically ---------- */
let rec = null, chunks = [], stream = null;
async function toWav(blob){
  const buf = await blob.arrayBuffer();
  const ctx = new (window.AudioContext || window.webkitAudioContext)({sampleRate:16000});
  const audio = await ctx.decodeAudioData(buf);
  const ch = audio.getChannelData(0);
  const dv = new DataView(new ArrayBuffer(44 + ch.length*2));
  const w = (o,t)=>{for(let i=0;i<t.length;i++) dv.setUint8(o+i, t.charCodeAt(i));};
  w(0,'RIFF'); dv.setUint32(4, 36+ch.length*2, true); w(8,'WAVE'); w(12,'fmt ');
  dv.setUint32(16,16,true); dv.setUint16(20,1,true); dv.setUint16(22,1,true);
  dv.setUint32(24,16000,true); dv.setUint32(28,32000,true); dv.setUint16(32,2,true); dv.setUint16(34,16,true);
  w(36,'data'); dv.setUint32(40, ch.length*2, true);
  for(let i=0;i<ch.length;i++){ const x = Math.max(-1, Math.min(1, ch[i])); dv.setInt16(44+i*2, x<0 ? x*0x8000 : x*0x7FFF, true); }
  ctx.close();
  const bytes = new Uint8Array(dv.buffer); let bin = '';
  for(let i=0;i<bytes.length;i+=0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i,i+0x8000));
  return btoa(bin);
}
$('#mic').onclick = async ()=>{
  if(busy) return;
  if(rec && rec.state === 'recording'){ rec.stop(); return; }
  if(!navigator.mediaDevices || !window.MediaRecorder){ alert('Voice input works in Chrome, Edge or Safari.'); return; }
  try{ stream = await navigator.mediaDevices.getUserMedia({audio:true}); }
  catch(e){ alert('Please allow microphone access.'); return; }
  chunks = []; rec = new MediaRecorder(stream);
  let heard = false, lastVoice = Date.now(); const startT = Date.now();
  const ac = new (window.AudioContext || window.webkitAudioContext)();
  ac.resume();
  const an = ac.createAnalyser(); an.fftSize = 1024;
  ac.createMediaStreamSource(stream).connect(an);
  const buf = new Uint8Array(an.fftSize);
  const timer = setInterval(()=>{
    if(!rec || rec.state !== 'recording'){ clearInterval(timer); return; }
    an.getByteTimeDomainData(buf);
    let peak = 0;
    for(let i=0;i<buf.length;i++) peak = Math.max(peak, Math.abs(buf[i]-128));
    const now = Date.now();
    if(peak > 10){ heard = true; lastVoice = now; }
    if(heard && now - lastVoice > 1400) rec.stop();      // you stopped talking: send automatically
    else if(!heard && now - startT > 8000) rec.stop();   // nothing said: cancel
  }, 100);
  rec.ondataavailable = e => chunks.push(e.data);
  rec.onstart = ()=>{ $('#mic').classList.add('on'); input.placeholder = 'Listening...'; };
  rec.onstop = async ()=>{
    clearInterval(timer); ac.close();
    $('#mic').classList.remove('on'); input.placeholder = 'Ask SHABYX';
    stream.getTracks().forEach(t=>t.stop());
    if(!heard) return;
    try{ const data = await toWav(new Blob(chunks, {type: rec.mimeType})); send({mime:'audio/wav', data}); }
    catch(e){ alert('Could not read the recording. Please try again.'); }
  };
  rec.start();
  setTimeout(()=>{ if(rec && rec.state === 'recording') rec.stop(); }, 60000);
};

/* ---------- image attach ---------- */
function loadImage(file){
  if(!file) return;
  const rd = new FileReader();
  rd.onload = ()=>{
    const im = new Image();
    im.onload = ()=>{
      const s = Math.min(1, 1280/Math.max(im.width, im.height));
      const c = document.createElement('canvas');
      c.width = im.width*s; c.height = im.height*s;
      c.getContext('2d').drawImage(im,0,0,c.width,c.height);
      image = {mime:'image/jpeg', data:c.toDataURL('image/jpeg',.85).split(',')[1]};
      renderAttach(); refresh();
    };
    im.src = rd.result;
  };
  rd.readAsDataURL(file);
}
$('#plus').onclick = e=>{e.stopPropagation();$('#menu').classList.toggle('show')};
document.addEventListener('click',()=>$('#menu').classList.remove('show'));
$('#pickImg').onclick = ()=>$('#fileImg').click();
$('#pickCam').onclick = ()=>$('#fileCam').click();
$('#fileImg').onchange = e=>{loadImage(e.target.files[0]);e.target.value=''};
$('#fileCam').onchange = e=>{loadImage(e.target.files[0]);e.target.value=''};

/* ---------- chips / new chat ---------- */
$('#chipWrite').onclick = ()=>{input.value='Help me write or edit: ';input.focus();refresh()};
$('#chipWeb').onclick = ()=>{web=true;renderAttach();input.focus()};
$('#newChat').onclick = ()=>{
  history=[]; image=null; web=false; list.innerHTML=''; input.value='';
  speechSynthesis.cancel(); document.body.className='empty'; renderAttach(); refresh();
};
refresh();
</script>
</body>
</html>
