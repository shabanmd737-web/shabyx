<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SHABYX</title>
<meta name="theme-color" content="#000000">
<meta name="description" content="SHABYX AI assistant">
<link rel="icon" type="image/png" sizes="32x32" href="/public/kippo-icon-32.png">
<link rel="icon" type="image/png" sizes="64x64" href="/public/kippo-icon-64.png">
<link rel="apple-touch-icon" href="/public/kippo-icon-180.png">
<link rel="manifest" href="/public/kippo-manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SHABYX">
<meta property="og:title" content="SHABYX">
<meta property="og:description" content="SHABYX AI assistant. Free to use.">
<meta property="og:type" content="website">
<meta property="og:image" content="__BASE__/public/kippo-share.png">
<meta name="twitter:card" content="summary_large_image">
<style>
:root{--bg:#0d0d0f;--panel:#1a1b1f;--line:#2a2c33;--text:#ececf1;--mute:#9a9ca6;--blue:#2d9bff;
--top:env(safe-area-inset-top,0px);--bot:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--text);
font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:16px}
body{display:flex;flex-direction:column;padding-top:var(--top)}
header{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line)}
header img{width:30px;height:30px;border-radius:8px}
header b{font-size:17px;letter-spacing:.3px}
header .sp{flex:1}
.pill{background:transparent;border:1px solid var(--line);color:var(--mute);border-radius:999px;
padding:5px 11px;font-size:13px;cursor:pointer}
.pill.on{color:var(--text);border-color:var(--blue)}
#chat{flex:1;overflow-y:auto;padding:18px 14px}
.wrap{max-width:760px;margin:0 auto}
#welcome{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center}
#welcome img{width:84px;height:84px;border-radius:22px}
#welcome h1{font-size:26px;font-weight:600;margin:0}
.msg{display:flex;margin:14px 0}
.msg.user{justify-content:flex-end}
.bubble{max-width:88%;padding:10px 14px;border-radius:18px;line-height:1.55;white-space:pre-wrap;word-wrap:break-word}
.user .bubble{background:var(--panel)}
.bot .bubble{padding-left:0;max-width:100%}
.bubble img{max-width:220px;border-radius:12px;display:block;margin-bottom:8px}
.spin{width:22px;height:22px;animation:r 1.6s linear infinite;vertical-align:middle}
@keyframes r{to{transform:rotate(360deg)}}
.note{color:var(--mute);font-size:13px;margin-left:8px}
footer{padding:8px 14px calc(12px + var(--bot))}
#prev{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}
#prev .chip{position:relative}
#prev img{width:56px;height:56px;object-fit:cover;border-radius:10px}
#prev button{position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;
border:0;background:#444;color:#fff;cursor:pointer;line-height:20px;padding:0}
.box{display:flex;align-items:flex-end;gap:6px;background:var(--panel);border:1px solid var(--line);
border-radius:26px;padding:8px 8px 8px 12px}
textarea{flex:1;background:transparent;border:0;outline:0;color:var(--text);font:inherit;resize:none;
max-height:160px;padding:7px 4px}
.ic{width:38px;height:38px;border-radius:50%;border:0;background:transparent;color:var(--mute);
cursor:pointer;display:flex;align-items:center;justify-content:center;flex:none}
.ic:hover{color:var(--text)}
.ic.rec{color:#ff5a5a}
#send{background:#fff;color:#000}
#send:disabled{opacity:.35;cursor:default}
.hint{text-align:center;color:var(--mute);font-size:12px;margin-top:8px}
button:focus-visible,textarea:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:4s}}
</style>
</head>
<body>
<header>
  <img src="/public/kippo-icon-64.png" alt="SHABYX logo">
  <b>SHABYX</b>
  <span class="sp"></span>
  <button class="pill" id="lang" title="Voice input language">EN</button>
  <button class="pill" id="speak" title="Read replies aloud">Voice off</button>
</header>

<main id="chat"><div class="wrap" id="list">
  <div id="welcome">
    <img src="/public/kippo-icon-512.png" alt="SHABYX">
    <h1>What's on your mind today?</h1>
  </div>
</div></main>

<footer><div class="wrap">
  <div id="prev"></div>
  <div class="box">
    <button class="ic" id="attach" title="Attach image" aria-label="Attach image">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    </button>
    <textarea id="inp" rows="1" placeholder="Ask SHABYX"></textarea>
    <button class="ic" id="mic" title="Speak" aria-label="Speak">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
    </button>
    <button class="ic" id="send" title="Send" aria-label="Send" disabled>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
    </button>
  </div>
  <div class="hint">SHABYX can make mistakes. Check important information.</div>
</div></footer>
<input type="file" id="file" accept="image/*" multiple hidden>

<script>
const $ = id => document.getElementById(id);
const list = $('list'), chat = $('chat'), inp = $('inp'), sendBtn = $('send');
let history = [], pending = [], busy = false, speakOn = false, lang = 'en-IN';

const STAR = '<svg class="spin" viewBox="0 0 24 24"><g fill="#2d9bff">' +
  [0,45,90,135].map(a => `<rect x="11" y="1.5" width="2" height="21" rx="1" transform="rotate(${a} 12 12)"/>`).join('') +
  '</g></svg>';

function scrollDown(){ chat.scrollTop = chat.scrollHeight; }
function esc(s){ return s.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

function addMsg(role, html){
  const w = $('welcome'); if (w) w.remove();
  const d = document.createElement('div');
  d.className = 'msg ' + role;
  d.innerHTML = '<div class="bubble">' + html + '</div>';
  list.appendChild(d); scrollDown();
  return d.querySelector('.bubble');
}

function refresh(){ sendBtn.disabled = busy || (!inp.value.trim() && !pending.length); }
inp.addEventListener('input', () => { inp.style.height = 'auto'; inp.style.height = inp.scrollHeight + 'px'; refresh(); });
inp.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey && !/Mobi|Android/i.test(navigator.userAgent)) { e.preventDefault(); send(); } });
sendBtn.onclick = send;

// ---------- images ----------
$('attach').onclick = () => $('file').click();
$('file').onchange = async e => {
  for (const f of e.target.files) {
    const img = await shrink(f);
    if (img) pending.push(img);
  }
  e.target.value = ''; drawPrev(); refresh();
};
function shrink(file){
  return new Promise(res => {
    const im = new Image(), url = URL.createObjectURL(file);
    im.onload = () => {
      const k = Math.min(1, 1024 / Math.max(im.width, im.height));
      const c = document.createElement('canvas');
      c.width = Math.round(im.width * k); c.height = Math.round(im.height * k);
      c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
      const data = c.toDataURL('image/jpeg', .85);
      URL.revokeObjectURL(url);
      res({ mime: 'image/jpeg', data: data.split(',')[1], src: data });
    };
    im.onerror = () => res(null);
    im.src = url;
  });
}
function drawPrev(){
  $('prev').innerHTML = '';
  pending.forEach((p, i) => {
    const d = document.createElement('div'); d.className = 'chip';
    d.innerHTML = `<img src="${p.src}" alt="attached image"><button aria-label="Remove">x</button>`;
    d.querySelector('button').onclick = () => { pending.splice(i, 1); drawPrev(); refresh(); };
    $('prev').appendChild(d);
  });
}

// ---------- voice ----------
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null;
$('lang').onclick = () => {
  lang = lang === 'en-IN' ? 'hi-IN' : 'en-IN';
  $('lang').textContent = lang === 'en-IN' ? 'EN' : 'हिं';
};
$('mic').onclick = () => {
  if (!SR) { alert('Voice input is not supported in this browser. Try Chrome.'); return; }
  if (rec) { rec.stop(); return; }
  rec = new SR(); rec.lang = lang; rec.interimResults = true;
  const base = inp.value;
  $('mic').classList.add('rec');
  rec.onresult = e => {
    let t = ''; for (const r of e.results) t += r[0].transcript;
    inp.value = (base ? base + ' ' : '') + t; inp.dispatchEvent(new Event('input'));
  };
  rec.onend = () => { rec = null; $('mic').classList.remove('rec'); };
  rec.onerror = () => { rec = null; $('mic').classList.remove('rec'); };
  rec.start();
};
$('speak').onclick = () => {
  speakOn = !speakOn;
  $('speak').textContent = speakOn ? 'Voice on' : 'Voice off';
  $('speak').classList.toggle('on', speakOn);
  if (!speakOn) speechSynthesis.cancel();
};
function speak(text){
  if (!speakOn || !('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text.replace(/[*#`_]/g, ''));
  const hindi = /[\u0900-\u097F]/.test(text);
  u.lang = hindi ? 'hi-IN' : 'en-IN';
  const vs = speechSynthesis.getVoices().filter(v => v.lang.startsWith(u.lang.slice(0, 2)));
  const girl = vs.find(v => /female|zira|heera|neerja|swara|samantha|google/i.test(v.name)) || vs[0];
  if (girl) u.voice = girl;
  speechSynthesis.speak(u);
}

// ---------- send with streaming + auto retry ----------
const wait = ms => new Promise(r => setTimeout(r, ms));

async function askServer(payload, onText, onSlow){
  for (let attempt = 0; attempt < 3; attempt++) {
    const ctl = new AbortController();
    const slow = setTimeout(onSlow, 6000);
    try {
      const r = await fetch('/api/chat', { method: 'POST', signal: ctl.signal,
        headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
      if (!r.ok || !r.body) throw new Error('bad status ' + r.status);
      const reader = r.body.getReader(), dec = new TextDecoder();
      let full = '';
      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        clearTimeout(slow);
        full += dec.decode(value, { stream: true });
        onText(full);
      }
      clearTimeout(slow);
      if (full) return full;
      throw new Error('empty');
    } catch (err) {
      clearTimeout(slow);
      if (attempt === 2) throw err;
      await wait(1500 * (attempt + 1));
    }
  }
}

async function send(){
  const text = inp.value.trim();
  if (busy || (!text && !pending.length)) return;
  busy = true; refresh();
  const imgs = pending.slice();
  const mine = (imgs.map(p => `<img src="${p.src}" alt="">`).join('')) + esc(text);
  addMsg('user', mine);
  history.push({ role: 'user', text, images: imgs.map(p => ({ mime: p.mime, data: p.data })) });
  inp.value = ''; inp.style.height = 'auto'; pending = []; drawPrev();

  const bubble = addMsg('bot', STAR);
  const light = history.map((m, i) => i === history.length - 1 ? m : { role: m.role, text: m.text });
  try {
    const answer = await askServer({ messages: light },
      t => { bubble.textContent = t; scrollDown(); },
      () => { if (!bubble.dataset.t) bubble.innerHTML = STAR + '<span class="note">SHABYX is waking up, one moment...</span>'; });
    history.push({ role: 'assistant', text: answer });
    speak(answer);
  } catch (e) {
    bubble.textContent = 'Could not reach SHABYX. Check your internet connection and send again.';
    history.pop();
  }
  busy = false; refresh(); scrollDown();
}
</script>
</body>
</html>
