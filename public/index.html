<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SHABYX</title>
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon.svg">
<meta name="theme-color" content="#0f1226">
<style>
:root{--bg:#f2f4f8;--ink:#0f1226;--mute:#5d6280;--line:#dde1ec;--card:#fff;--acc:#ffb020;--accink:#0f1226;--user:#0f1226;--userink:#fff;--rec:#d6336c}
@media (prefers-color-scheme:dark){:root{--bg:#0f1226;--ink:#eef0fa;--mute:#9aa0c4;--line:#252a4d;--card:#181c3a;--user:#ffb020;--userink:#0f1226}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--line)}
.hr{display:flex;gap:8px;align-items:center}
h1{font-size:22px;margin:0;font-weight:800;letter-spacing:.5px}
h1 span{color:var(--acc)}
button{font:inherit;cursor:pointer}
#new,.hb{background:none;border:1px solid var(--line);color:var(--ink);border-radius:20px;padding:6px 14px}
.hb{padding:6px 11px;min-width:42px}
.hb[aria-pressed="true"]{background:var(--acc);color:var(--accink);border-color:var(--acc)}
main{flex:1;overflow-y:auto;padding:16px}
.wrap{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.m{max-width:88%;white-space:pre-wrap;word-wrap:break-word}
.u{align-self:flex-end;background:var(--user);color:var(--userink);padding:10px 14px;border-radius:18px 18px 4px 18px}
.b{align-self:flex-start}
.m img{display:block;max-width:100%;height:auto;border-radius:12px}
.u img{max-height:260px;margin-bottom:6px}
.b img{max-height:460px;margin:4px 0 6px}
.dl{display:inline-block;font-size:14px;color:var(--ink);border:1px solid var(--line);border-radius:16px;padding:3px 12px;text-decoration:none;margin-bottom:6px}
.b code{background:var(--card);border:1px solid var(--line);border-radius:4px;padding:1px 5px;font-size:14px}
.b pre{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;overflow-x:auto;margin:8px 0;white-space:pre}
.b pre code{border:0;padding:0}
.err{color:#d6336c}
.empty{margin:12vh auto 0;text-align:center;color:var(--mute)}
.empty b{display:block;color:var(--ink);font-size:24px;margin-bottom:6px}
.dots{display:inline-flex;gap:4px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--mute);animation:d 1s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes d{0%,80%,100%{opacity:.25}40%{opacity:1}}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(214,51,108,.55)}100%{box-shadow:0 0 0 14px rgba(214,51,108,0)}}
@media (prefers-reduced-motion:reduce){.dots i{animation:none}#mic.on{animation:none}}
form{padding:10px 16px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
.row{max-width:720px;margin:0 auto;display:flex;gap:8px;align-items:flex-end}
textarea{flex:1;min-width:0;resize:none;max-height:140px;font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:22px;padding:10px 16px;outline:none}
textarea:focus-visible,button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
#send{background:var(--acc);color:var(--accink);border:0;border-radius:50%;width:44px;height:44px;font-weight:800;font-size:18px;flex:none}
#send:disabled{opacity:.5}
#mic,#att,#gen{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:50%;width:44px;height:44px;font-size:18px;flex:none;padding:0}
#gen[aria-pressed="true"]{background:var(--acc);color:var(--accink);border-color:var(--acc)}
#mic.on{background:var(--rec);border-color:var(--rec);color:#fff;animation:pulse 1.2s infinite}
@media (max-width:400px){#mic,#att,#gen,#send{width:38px;height:38px;font-size:16px}.row{gap:6px}}
#status{max-width:720px;margin:0 auto 6px;min-height:18px;font-size:13px;color:var(--mute);text-align:center}
#prev{max-width:720px;margin:0 auto 8px;display:none;align-items:center;gap:10px}
#prev.show{display:flex}
#prev img{height:56px;width:56px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
#rm{background:none;border:1px solid var(--line);color:var(--ink);border-radius:16px;padding:3px 12px;font-size:14px}
</style>
</head>
<body>
<header><h1>SHABY<span>X</span></h1>
<div class="hr">
<button id="lang" class="hb" type="button" aria-label="Voice ki bhasha badlo" title="Voice ki bhasha">हिं</button>
<button id="vr" class="hb" type="button" aria-pressed="false" aria-label="Jawab bolkar sunao" title="Jawab bolkar sunao">&#128263;</button>
<button id="new" type="button">New chat</button>
</div></header>
<main id="main"><div class="wrap" id="chat"></div></main>
<form id="f">
<div id="status" aria-live="polite"></div>
<div id="prev"></div>
<div class="row">
<textarea id="t" rows="1" placeholder="Kuch bhi pucho..." aria-label="Message"></textarea>
<input type="file" id="file" accept="image/*" hidden>
<button id="att" type="button" aria-label="Photo ya image jodo" title="Photo ya image jodo">&#128206;</button>
<button id="gen" type="button" aria-pressed="false" aria-label="Image banane ka mode" title="Image banao">&#127912;</button>
<button id="mic" type="button" aria-label="Bol kar pucho" title="Bol kar pucho">&#127908;</button>
<button id="send" aria-label="Bhejo">&#10148;</button>
</div></form>
<script>
const chat=document.getElementById("chat"),main=document.getElementById("main"),t=document.getElementById("t"),send=document.getElementById("send");
const mic=document.getElementById("mic"),langBtn=document.getElementById("lang"),vrBtn=document.getElementById("vr"),statusEl=document.getElementById("status");
const fileIn=document.getElementById("file"),att=document.getElementById("att"),gen=document.getElementById("gen"),prev=document.getElementById("prev");
let hist=[];
try{hist=JSON.parse(localStorage.getItem("shabyx")||"[]")}catch(e){}
/* images sirf memory me rehti hain (localStorage chhota hota hai), save me nahi jaati */
const save=()=>{try{localStorage.setItem("shabyx",JSON.stringify(hist.slice(-40).map(m=>({role:m.role,content:m.content||(m.img?"[image bheji thi]":"")}))))}catch(e){}};
const esc=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
function fmt(s){
  s=esc(s);
  s=s.replace(/```(?:\w+)?\n?([\s\S]*?)```/g,(_,c)=>"<pre><code>"+c.replace(/\n$/,"")+"</code></pre>");
  s=s.replace(/`([^`\n]+)`/g,"<code>$1</code>").replace(/\*\*([^*\n]+)\*\*/g,"<b>$1</b>");
  return s;
}
function add(role,text,img){
  const d=document.createElement("div");d.className="m "+(role==="user"?"u":"b");
  if(role==="user"){
    if(img){const im=document.createElement("img");im.src=img;im.alt="Tumhari bheji image";d.appendChild(im)}
    if(text){const s=document.createElement("span");s.textContent=text;d.appendChild(s)}
  }else d.innerHTML=fmt(text||"");
  chat.appendChild(d);main.scrollTop=main.scrollHeight;return d;
}
function showImage(w,src,note){
  w.className="m b";w.innerHTML="";
  const im=document.createElement("img");im.src=src;im.alt="SHABYX ki banayi image";w.appendChild(im);
  const a=document.createElement("a");a.className="dl";a.href=src;a.download="shabyx-image.png";a.textContent="Save karo";w.appendChild(a);
  if(note){const n=document.createElement("div");n.innerHTML=fmt(note);w.appendChild(n)}
  main.scrollTop=main.scrollHeight;
}
function render(){
  chat.innerHTML="";
  if(!hist.length){chat.innerHTML='<div class="empty"><b>Namaste, main SHABYX hun</b>Padhai, code, idea ya kuch bhi, Hindi ya English me pucho. Mic se bolo, photo bhejo, ya 🎨 dabake image banwao.</div>';return}
  hist.forEach(m=>{
    if(m.role==="assistant"&&m.img){const w=add("assistant","");showImage(w,m.img,"")}
    else add(m.role,m.content,m.img);
  });
}

/* ---------- VOICE ---------- */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
const canSpeak="speechSynthesis" in window;
const store={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
let lang=store.get("shabyx_lang")||"hi-IN";
let voiceReply=store.get("shabyx_vr")==="1";
let viaVoice=false,listening=false,rec=null;
const setStatus=s=>{statusEl.textContent=s||""};

function paintControls(){
  langBtn.textContent=lang==="hi-IN"?"हिं":"EN";
  vrBtn.innerHTML=voiceReply?"&#128266;":"&#128263;";
  vrBtn.setAttribute("aria-pressed",voiceReply?"true":"false");
}
paintControls();
if(!SR)mic.style.display="none";
if(!canSpeak)vrBtn.style.display="none";

langBtn.onclick=()=>{lang=lang==="hi-IN"?"en-IN":"hi-IN";store.set("shabyx_lang",lang);paintControls();setStatus(lang==="hi-IN"?"Voice: Hindi/Hinglish":"Voice: English")};
vrBtn.onclick=()=>{voiceReply=!voiceReply;store.set("shabyx_vr",voiceReply?"1":"0");if(!voiceReply)stopSpeak();paintControls();setStatus(voiceReply?"Ab har jawab bolkar sunaunga":"Jawab sirf likha aayega (mic se pucho to bolkar bhi sunaunga)")};

function stopSpeak(){if(canSpeak)speechSynthesis.cancel()}

function cleanForSpeech(s){
  return s
    .replace(/```[\s\S]*?```/g," (code screen par likha hai) ")
    .replace(/`([^`]*)`/g,"$1")
    .replace(/https?:\/\/\S+/g," link ")
    .replace(/\*\*?/g,"")
    .replace(/[#>_~|]/g," ")
    .replace(/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}\u{FE0F}]/gu,"")
    .replace(/\s+/g," ").trim();
}
function chunks(s){
  const parts=s.split(/(?<=[.!?।])\s+/),out=[];let cur="";
  for(const p of parts){
    if((cur+" "+p).length>170&&cur){out.push(cur);cur=p}else cur=cur?cur+" "+p:p;
  }
  if(cur)out.push(cur);
  return out;
}
function pickVoice(code){
  const vs=speechSynthesis.getVoices();
  const l=code.toLowerCase();
  return vs.find(v=>v.lang.replace("_","-").toLowerCase()===l)
      ||vs.find(v=>v.lang.toLowerCase().startsWith(l.slice(0,2)))
      ||vs.find(v=>v.lang.toLowerCase().startsWith("en-in"))
      ||null;
}
function speak(text){
  if(!canSpeak)return;
  const c=chunks(cleanForSpeech(text));
  if(!c.length)return;
  speechSynthesis.cancel();
  const code=/[\u0900-\u097F]/.test(text)?"hi-IN":"en-IN";
  const v=pickVoice(code);
  c.forEach((p,i)=>{
    const u=new SpeechSynthesisUtterance(p);
    u.lang=code;if(v)u.voice=v;u.rate=1;
    if(i===0)u.onstart=()=>setStatus("Bol raha hun... (rokne ke liye mic dabao)");
    if(i===c.length-1)u.onend=()=>setStatus("");
    speechSynthesis.speak(u);
  });
}
if(canSpeak)speechSynthesis.onvoiceschanged=()=>{};

function startListen(){
  stopSpeak();
  rec=new SR();
  rec.lang=lang;rec.interimResults=true;rec.continuous=false;rec.maxAlternatives=1;
  let heard=false,failed=false;
  rec.onstart=()=>{listening=true;mic.classList.add("on");setStatus("Sun raha hun... bolo")};
  rec.onresult=e=>{
    let fin="",interim="";
    for(let i=0;i<e.results.length;i++){const r=e.results[i];if(r.isFinal)fin+=r[0].transcript;else interim+=r[0].transcript}
    const txt=(fin+interim).trim();
    if(txt){heard=true;t.value=txt;t.style.height="auto";t.style.height=Math.min(t.scrollHeight,140)+"px"}
  };
  rec.onerror=e=>{
    if(e.error==="no-speech"){setStatus("Kuch sunai nahi diya, dobara try karo.")}
    else if(e.error==="not-allowed"||e.error==="service-not-allowed"){failed=true;setStatus("Mic ki permission do (browser ke address bar me mic allow karo).")}
    else if(e.error==="network"){failed=true;setStatus("Voice ke liye internet chahiye.")}
    else if(e.error!=="aborted"){failed=true;setStatus("Voice me dikkat aayi, dobara try karo.")}
  };
  rec.onend=()=>{
    listening=false;mic.classList.remove("on");
    if(heard&&!failed&&t.value.trim()){setStatus("");viaVoice=true;go()}
    else if(!failed&&statusEl.textContent==="Sun raha hun... bolo")setStatus("");
  };
  try{rec.start()}catch(e){setStatus("Mic start nahi hua, dobara dabao.")}
}
mic.onclick=()=>{
  if(listening){rec&&rec.stop();return}
  if(canSpeak&&speechSynthesis.speaking){stopSpeak();setStatus("")}
  startListen();
};
/* ---------- /VOICE ---------- */

/* ---------- IMAGE ---------- */
let pending=null,genMode=false;
function shrink(file){
  return new Promise((res,rej)=>{
    const url=URL.createObjectURL(file),im=new Image();
    im.onload=()=>{
      const k=Math.min(1,1280/Math.max(im.naturalWidth,im.naturalHeight));
      const w=Math.round(im.naturalWidth*k),h=Math.round(im.naturalHeight*k);
      const c=document.createElement("canvas");c.width=w;c.height=h;
      const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,w,h);x.drawImage(im,0,0,w,h);
      URL.revokeObjectURL(url);res(c.toDataURL("image/jpeg",.85));
    };
    im.onerror=()=>{URL.revokeObjectURL(url);rej(new Error("bad image"))};
    im.src=url;
  });
}
function showPrev(){
  prev.innerHTML="";
  if(!pending){prev.classList.remove("show");return}
  const im=document.createElement("img");im.src=pending;im.alt="Chuni hui image";
  const b=document.createElement("button");b.type="button";b.id="rm";b.textContent="Hatao";
  b.onclick=()=>{pending=null;showPrev()};
  prev.appendChild(im);prev.appendChild(b);prev.classList.add("show");
}
att.onclick=()=>fileIn.click();
fileIn.onchange=async()=>{
  const f=fileIn.files[0];fileIn.value="";
  if(!f)return;
  if(!f.type.startsWith("image/")){setStatus("Sirf image (photo) chuno.");return}
  try{pending=await shrink(f);showPrev();setStatus(genMode?"Ye image edit hogi. Likho kya badalna hai.":"Image jud gayi. Ab sawaal likho ya seedha bhejo.")}
  catch(e){setStatus("Ye image khul nahi payi, dusri try karo.")}
};
gen.onclick=()=>{
  genMode=!genMode;
  gen.setAttribute("aria-pressed",genMode?"true":"false");
  t.placeholder=genMode?"Kaisi image banani hai? Likho...":"Kuch bhi pucho...";
  setStatus(genMode?"Image mode ON: jo likhoge uski image banegi.":"Image mode OFF: normal chat.");
};
/* ---------- /IMAGE ---------- */

async function go(e){
  e&&e.preventDefault();
  const text=t.value.trim();
  if((!text&&!pending)||send.disabled)return;
  if(genMode&&!text){setStatus("Pehle likho ki kaisi image banani hai.");return}
  const speakIt=viaVoice||voiceReply;viaVoice=false;
  stopSpeak();
  if(!hist.length)chat.innerHTML="";
  const img=pending;pending=null;showPrev();
  hist.push({role:"user",content:text,img:img||undefined});const ub=add("user",text,img);
  t.value="";t.style.height="auto";
  send.disabled=true;
  const w=add("assistant","");w.innerHTML='<span class="dots"><i></i><i></i><i></i></span>';
  try{
    if(genMode){
      const r=await fetch("/api/image",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({prompt:text,image:img||null})});
      const d=await r.json();
      if(!r.ok)throw new Error(d.error||"Image nahi ban payi.");
      hist.push({role:"assistant",content:"[Image banayi gayi: "+text.slice(0,200)+"]",img:d.image});
      showImage(w,d.image,d.text);save();
    }else{
      const msgs=hist.map(m=>({role:m.role,content:m.content}));
      let keep=2;
      for(let i=hist.length-1;i>=0&&keep>0;i--){if(hist[i].role==="user"&&hist[i].img){msgs[i].image=hist[i].img;keep--}}
      const r=await fetch("/api/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({messages:msgs,voice:speakIt})});
      const d=await r.json();
      if(!r.ok)throw new Error(d.error||"Kuch gadbad hui.");
      hist.push({role:"assistant",content:d.reply});w.innerHTML=fmt(d.reply);save();
      if(speakIt)speak(d.reply);
    }
  }catch(err){
    hist.pop();ub.remove();w.className="m b err";w.textContent=err.message;
    t.value=text;if(img){pending=img;showPrev()}
  }
  send.disabled=false;main.scrollTop=main.scrollHeight;
}
document.getElementById("f").addEventListener("submit",go);
t.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey&&matchMedia("(pointer:fine)").matches){go(e)}});
t.addEventListener("input",()=>{t.style.height="auto";t.style.height=Math.min(t.scrollHeight,140)+"px"});
document.getElementById("new").onclick=()=>{stopSpeak();setStatus("");pending=null;showPrev();hist=[];save();render()};
render();
</script>
</body>
</html>
