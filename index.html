<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SHABYX</title>
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon.svg">
<meta name="theme-color" content="#0f1226">
<style>
:root{--bg:#f2f4f8;--ink:#0f1226;--mute:#5d6280;--line:#dde1ec;--card:#fff;--acc:#ffb020;--accink:#0f1226;--user:#0f1226;--userink:#fff;--rec:#d6336c}
@media (prefers-color-scheme:dark){:root{--bg:#0f1226;--ink:#eef0fa;--mute:#9aa0c4;--line:#252a4d;--card:#181c3a;--user:#ffb020;--userink:#0f1226}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--line)}
.hr{display:flex;gap:8px;align-items:center}
h1{font-size:22px;margin:0;font-weight:800;letter-spacing:.5px}
h1 span{color:var(--acc)}
button{font:inherit;cursor:pointer}
#new,.hb{background:none;border:1px solid var(--line);color:var(--ink);border-radius:20px;padding:6px 14px}
.hb{padding:6px 11px;min-width:42px}
.hb[aria-pressed="true"]{background:var(--acc);color:var(--accink);border-color:var(--acc)}
main{flex:1;overflow-y:auto;padding:16px}
.wrap{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.m{max-width:88%;white-space:pre-wrap;word-wrap:break-word}
.u{align-self:flex-end;background:var(--user);color:var(--userink);padding:10px 14px;border-radius:18px 18px 4px 18px}
.b{align-self:flex-start}
.b code{background:var(--card);border:1px solid var(--line);border-radius:4px;padding:1px 5px;font-size:14px}
.b pre{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;overflow-x:auto;margin:8px 0;white-space:pre}
.b pre code{border:0;padding:0}
.err{color:#d6336c}
.empty{margin:12vh auto 0;text-align:center;color:var(--mute)}
.empty b{display:block;color:var(--ink);font-size:24px;margin-bottom:6px}
.dots{display:inline-flex;gap:4px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--mute);animation:d 1s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes d{0%,80%,100%{opacity:.25}40%{opacity:1}}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(214,51,108,.55)}100%{box-shadow:0 0 0 14px rgba(214,51,108,0)}}
@media (prefers-reduced-motion:reduce){.dots i{animation:none}#mic.on{animation:none}}
form{padding:10px 16px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
.row{max-width:720px;margin:0 auto;display:flex;gap:8px;align-items:flex-end}
textarea{flex:1;resize:none;max-height:140px;font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:22px;padding:10px 16px;outline:none}
textarea:focus-visible,button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
#send{background:var(--acc);color:var(--accink);border:0;border-radius:50%;width:44px;height:44px;font-weight:800;font-size:18px}
#send:disabled{opacity:.5}
#mic{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:50%;width:44px;height:44px;font-size:18px;flex:none}
#mic.on{background:var(--rec);border-color:var(--rec);color:#fff;animation:pulse 1.2s infinite}
#status{max-width:720px;margin:0 auto 6px;min-height:18px;font-size:13px;color:var(--mute);text-align:center}
</style>
</head>
<body>
<header><h1>SHABY<span>X</span></h1>
<div class="hr">
<button id="lang" class="hb" type="button" aria-label="Voice ki bhasha badlo" title="Voice ki bhasha">हिं</button>
<button id="vr" class="hb" type="button" aria-pressed="false" aria-label="Jawab bolkar sunao" title="Jawab bolkar sunao">&#128263;</button>
<button id="new" type="button">Nayi chat</button>
</div></header>
<main id="main"><div class="wrap" id="chat"></div></main>
<form id="f">
<div id="status" aria-live="polite"></div>
<div class="row">
<textarea id="t" rows="1" placeholder="Kuch bhi pucho..." aria-label="Message"></textarea>
<button id="mic" type="button" aria-label="Bol kar pucho" title="Bol kar pucho">&#127908;</button>
<button id="send" aria-label="Bhejo">&#10148;</button>
</div></form>
<script>
const chat=document.getElementById("chat"),main=document.getElementById("main"),t=document.getElementById("t"),send=document.getElementById("send");
const mic=document.getElementById("mic"),langBtn=document.getElementById("lang"),vrBtn=document.getElementById("vr"),statusEl=document.getElementById("status");
let hist=[];
try{hist=JSON.parse(localStorage.getItem("shabyx")||"[]")}catch(e){}
const save=()=>{try{localStorage.setItem("shabyx",JSON.stringify(hist.slice(-40)))}catch(e){}};
const esc=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
function fmt(s){
  s=esc(s);
  s=s.replace(/```(?:\w+)?\n?([\s\S]*?)```/g,(_,c)=>"<pre><code>"+c.replace(/\n$/,"")+"</code></pre>");
  s=s.replace(/`([^`\n]+)`/g,"<code>$1</code>").replace(/\*\*([^*\n]+)\*\*/g,"<b>$1</b>");
  return s;
}
function add(role,text){
  const d=document.createElement("div");d.className="m "+(role==="user"?"u":"b");
  if(role==="user")d.textContent=text;else d.innerHTML=fmt(text);
  chat.appendChild(d);main.scrollTop=main.scrollHeight;return d;
}
function render(){
  chat.innerHTML="";
  if(!hist.length){chat.innerHTML='<div class="empty"><b>Namaste, main SHABYX hun</b>Padhai, code, idea ya kuch bhi, Hindi ya English me pucho. Mic dabao aur bolkar bhi pooch sakte ho.</div>';return}
  hist.forEach(m=>add(m.role,m.content));
}

/* ---------- VOICE ---------- */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
const canSpeak="speechSynthesis" in window;
const store={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
let lang=store.get("shabyx_lang")||"hi-IN";
let voiceReply=store.get("shabyx_vr")==="1";
let viaVoice=false,listening=false,rec=null;
const setStatus=s=>{statusEl.textContent=s||""};

function paintControls(){
  langBtn.textContent=lang==="hi-IN"?"हिं":"EN";
  vrBtn.innerHTML=voiceReply?"&#128266;":"&#128263;";
  vrBtn.setAttribute("aria-pressed",voiceReply?"true":"false");
}
paintControls();
if(!SR)mic.style.display="none";
if(!canSpeak)vrBtn.style.display="none";

langBtn.onclick=()=>{lang=lang==="hi-IN"?"en-IN":"hi-IN";store.set("shabyx_lang",lang);paintControls();setStatus(lang==="hi-IN"?"Voice: Hindi/Hinglish":"Voice: English")};
vrBtn.onclick=()=>{voiceReply=!voiceReply;store.set("shabyx_vr",voiceReply?"1":"0");if(!voiceReply)stopSpeak();paintControls();setStatus(voiceReply?"Ab har jawab bolkar sunaunga":"Jawab sirf likha aayega (mic se pucho to bolkar bhi sunaunga)")};

function stopSpeak(){if(canSpeak)speechSynthesis.cancel()}

function cleanForSpeech(s){
  return s
    .replace(/```[\s\S]*?```/g," (code screen par likha hai) ")
    .replace(/`([^`]*)`/g,"$1")
    .replace(/https?:\/\/\S+/g," link ")
    .replace(/\*\*?/g,"")
    .replace(/[#>_~|]/g," ")
    .replace(/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}\u{FE0F}]/gu,"")
    .replace(/\s+/g," ").trim();
}
function chunks(s){
  const parts=s.split(/(?<=[.!?।])\s+/),out=[];let cur="";
  for(const p of parts){
    if((cur+" "+p).length>170&&cur){out.push(cur);cur=p}else cur=cur?cur+" "+p:p;
  }
  if(cur)out.push(cur);
  return out;
}
function pickVoice(){
  const vs=speechSynthesis.getVoices();
  const l=lang.toLowerCase();
  return vs.find(v=>v.lang.replace("_","-").toLowerCase()===l)
      ||vs.find(v=>v.lang.toLowerCase().startsWith(l.slice(0,2)))
      ||vs.find(v=>v.lang.toLowerCase().startsWith("en-in"))
      ||null;
}
function speak(text){
  if(!canSpeak)return;
  const c=chunks(cleanForSpeech(text));
  if(!c.length)return;
  speechSynthesis.cancel();
  const v=pickVoice();
  c.forEach((p,i)=>{
    const u=new SpeechSynthesisUtterance(p);
    u.lang=lang;if(v)u.voice=v;u.rate=1;
    if(i===0)u.onstart=()=>setStatus("Bol raha hun... (rokne ke liye mic dabao)");
    if(i===c.length-1)u.onend=()=>setStatus("");
    speechSynthesis.speak(u);
  });
}
if(canSpeak)speechSynthesis.onvoiceschanged=()=>{};

function startListen(){
  stopSpeak();
  rec=new SR();
  rec.lang=lang;rec.interimResults=true;rec.continuous=false;rec.maxAlternatives=1;
  let heard=false,failed=false;
  rec.onstart=()=>{listening=true;mic.classList.add("on");setStatus("Sun raha hun... bolo")};
  rec.onresult=e=>{
    let fin="",interim="";
    for(let i=0;i<e.results.length;i++){const r=e.results[i];if(r.isFinal)fin+=r[0].transcript;else interim+=r[0].transcript}
    const txt=(fin+interim).trim();
    if(txt){heard=true;t.value=txt;t.style.height="auto";t.style.height=Math.min(t.scrollHeight,140)+"px"}
  };
  rec.onerror=e=>{
    if(e.error==="no-speech"){setStatus("Kuch sunai nahi diya, dobara try karo.")}
    else if(e.error==="not-allowed"||e.error==="service-not-allowed"){failed=true;setStatus("Mic ki permission do (browser ke address bar me mic allow karo).")}
    else if(e.error==="network"){failed=true;setStatus("Voice ke liye internet chahiye.")}
    else if(e.error!=="aborted"){failed=true;setStatus("Voice me dikkat aayi, dobara try karo.")}
  };
  rec.onend=()=>{
    listening=false;mic.classList.remove("on");
    if(heard&&!failed&&t.value.trim()){setStatus("");viaVoice=true;go()}
    else if(!failed&&statusEl.textContent==="Sun raha hun... bolo")setStatus("");
  };
  try{rec.start()}catch(e){setStatus("Mic start nahi hua, dobara dabao.")}
}
mic.onclick=()=>{
  if(listening){rec&&rec.stop();return}
  if(canSpeak&&speechSynthesis.speaking){stopSpeak();setStatus("")}
  startListen();
};
/* ---------- /VOICE ---------- */

async function go(e){
  e&&e.preventDefault();
  const text=t.value.trim();if(!text||send.disabled)return;
  const speakIt=viaVoice||voiceReply;viaVoice=false;
  stopSpeak();
  if(!hist.length)chat.innerHTML="";
  hist.push({role:"user",content:text});add("user",text);t.value="";t.style.height="auto";
  send.disabled=true;
  const w=add("assistant","");w.innerHTML='<span class="dots"><i></i><i></i><i></i></span>';
  try{
    const r=await fetch("/api/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({messages:hist})});
    const d=await r.json();
    if(!r.ok)throw new Error(d.error||"Kuch gadbad hui.");
    hist.push({role:"assistant",content:d.reply});w.innerHTML=fmt(d.reply);save();
    if(speakIt)speak(d.reply);
  }catch(err){hist.pop();w.className="m b err";w.textContent=err.message;}
  send.disabled=false;main.scrollTop=main.scrollHeight;
}
document.getElementById("f").addEventListener("submit",go);
t.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey&&matchMedia("(pointer:fine)").matches){go(e)}});
t.addEventListener("input",()=>{t.style.height="auto";t.style.height=Math.min(t.scrollHeight,140)+"px"});
document.getElementById("new").onclick=()=>{stopSpeak();setStatus("");hist=[];save();render()};
render();
</script>
</body>
</html>
